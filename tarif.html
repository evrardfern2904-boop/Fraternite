<section>

<h2>Frais de scolarité (Paiement en 3 tranches)</h2>

<table id="tableauTarifs">
<thead>
<tr>
<th>Classe</th>
<th>1ère tranche</th>
<th>2ème tranche</th>
<th>3ème tranche</th>
<th>Total</th>
</tr>
</thead>
<tbody id="corpsTableauTarifs">
</tbody>
</table>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
try {
  const SUPABASE_URL = "https://wvtkczhhhxtvhtgbiouz.supabase.co";
  const SUPABASE_KEY = "sb_publishable_67zbjKULBBMOE5beuZljLA_Yt6Dq0zI";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function formatFCFA(montant) {
    if (montant === null || montant === undefined) return "-";
    return Number(montant).toLocaleString("fr-FR") + " FCFA";
  }

  async function chargerTarifs() {
    const corps = document.getElementById("corpsTableauTarifs");

    const { data, error } = await supabase
      .from("tarifs")
      .select("*")
      .order("ordre", { ascending: true });

    if (error) {
      corps.innerHTML = `<tr><td colspan="5" style="color:red;">Erreur : ${error.message}</td></tr>`;
      return;
    }

    corps.innerHTML = data.map(t => `
      <tr>
        <td>${t.classe}</td>
        <td>${formatFCFA(t.tranche_1)}</td>
        <td>${formatFCFA(t.tranche_2)}</td>
        <td>${formatFCFA(t.tranche_3)}</td>
        <td>${formatFCFA(t.total)}</td>
      </tr>
    `).join("");
  }

  chargerTarifs();

} catch (err) {
  document.getElementById("corpsTableauTarifs").innerHTML = `<tr><td colspan="5" style="color:red;">Erreur de chargement : ${err.message}</td></tr>`;
}
</script>
